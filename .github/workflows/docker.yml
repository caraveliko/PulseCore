name: Docker

# Publicación automática de imagen multi-arquitectura (linux/amd64 y linux/arm64) en GHCR.
# Compila los binarios de forma nativa/cruzada antes de empaquetarlos en debian:bookworm-slim.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-binaries:
    name: Build Linux binaries (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            cross: false
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            cross: true
    steps:
      - uses: actions/checkout@v7

      - name: Instalar compilador cruzado aarch64
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Instalar cadena de herramientas Rust (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Caché de Cargo (${{ matrix.arch }})
        uses: Swatinem/rust-cache@v2
        with:
          key: docker-${{ matrix.arch }}

      - name: Compilar mule-daemon y mule-cli (release estándar)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: cargo build --release --target ${{ matrix.target }} -p mule-daemon -p mule-cli

      - name: Preparar binarios para Docker
        run: |
          mkdir -p dist/bin/${{ matrix.arch }}
          cp target/${{ matrix.target }}/release/mule-daemon dist/bin/${{ matrix.arch }}/
          cp target/${{ matrix.target }}/release/mule-cli dist/bin/${{ matrix.arch }}/

      - name: Subir artefactos (${{ matrix.arch }})
        uses: actions/upload-artifact@v7
        with:
          name: pulsecore-linux-${{ matrix.arch }}
          path: dist/bin/${{ matrix.arch }}/
          retention-days: 1

  publish:
    name: Build & push multi-arch image
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - uses: actions/checkout@v7

      - name: Descargar binarios amd64
        uses: actions/download-artifact@v8
        with:
          name: pulsecore-linux-amd64
          path: dist/bin/amd64

      - name: Descargar binarios arm64
        uses: actions/download-artifact@v8
        with:
          name: pulsecore-linux-arm64
          path: dist/bin/arm64

      - name: Hacer binarios ejecutables
        run: chmod +x dist/bin/amd64/* dist/bin/arm64/*

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadatos y etiquetas Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pulsecore
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Construir y publicar imagen multi-arch en GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.ci
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
