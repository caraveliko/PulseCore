name: Packages

# Compilación de artefactos distribuibles en cada push a master y bajo demanda.
# - windows-bundle: compila mule-daemon.exe, mule-cli.exe y mule-assistant.exe + SBOM + prueba de humo.
# - linux-bundle: compila los binarios nativos Linux x64 (servidor + CLI + asistente + plantilla systemd).
# - linux-arm64-bundle: compila los binarios Raspberry Pi / ARM64 (servidor + CLI + asistente + plantilla systemd).

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-bundle:
    name: Windows x64 server bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar cadena de herramientas Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Caché de Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-pkg

      - name: Compilar paquete servidor estándar (sin firma)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File scripts\build_windows_server.ps1

      - name: Verificar paquete generado (prueba de humo, sin métodos lab.*)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File scripts\test_packaged_bundle.ps1

      - name: Subir artefacto Windows
        uses: actions/upload-artifact@v4
        with:
          name: PulseCore-windows-x64
          path: |
            dist/PulseCore-Server-Windows-x64.zip
            dist/PulseCore-Server-Windows-x64.zip.sha256
          retention-days: 14

  linux-bundle:
    name: Linux x64 daemon + CLI + assistant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar cadena de herramientas Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Caché de Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-x64-pkg

      - name: Compilar daemon, CLI y asistente en Rust (release)
        run: cargo build --release -p mule-daemon -p mule-cli -p mule-assistant

      - name: Empaquetar distribución Linux
        run: |
          mkdir -p dist/PulseCore-Server-Linux
          cp target/release/mule-daemon target/release/mule-cli target/release/mule-assistant scripts/mule-daemon.service dist/PulseCore-Server-Linux/
          tar -czf dist/PulseCore-Server-Linux-x64.tar.gz -C dist PulseCore-Server-Linux
          (cd dist && sha256sum PulseCore-Server-Linux-x64.tar.gz > PulseCore-Server-Linux-x64.tar.gz.sha256)

      - name: Subir artefacto Linux
        uses: actions/upload-artifact@v4
        with:
          name: PulseCore-linux-x64
          path: |
            dist/PulseCore-Server-Linux-x64.tar.gz
            dist/PulseCore-Server-Linux-x64.tar.gz.sha256
          retention-days: 14

  linux-arm64-bundle:
    name: Linux ARM64 (Raspberry Pi) daemon + CLI + assistant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar compilador cruzado aarch64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Instalar cadena de herramientas Rust (aarch64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Caché de Cargo (aarch64)
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-arm64-pkg

      - name: Compilar daemon, CLI y asistente en Rust (aarch64 release)
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: cargo build --release --target aarch64-unknown-linux-gnu -p mule-daemon -p mule-cli -p mule-assistant

      - name: Empaquetar distribución Raspberry Pi (ARM64)
        run: |
          mkdir -p dist/PulseCore-Server-Linux-arm64
          cp target/aarch64-unknown-linux-gnu/release/mule-daemon target/aarch64-unknown-linux-gnu/release/mule-cli target/aarch64-unknown-linux-gnu/release/mule-assistant scripts/mule-daemon.service dist/PulseCore-Server-Linux-arm64/
          tar -czf dist/PulseCore-Server-Linux-arm64.tar.gz -C dist PulseCore-Server-Linux-arm64
          (cd dist && sha256sum PulseCore-Server-Linux-arm64.tar.gz > PulseCore-Server-Linux-arm64.tar.gz.sha256)

      - name: Subir artefacto Raspberry Pi (ARM64)
        uses: actions/upload-artifact@v4
        with:
          name: PulseCore-linux-arm64
          path: |
            dist/PulseCore-Server-Linux-arm64.tar.gz
            dist/PulseCore-Server-Linux-arm64.tar.gz.sha256
          retention-days: 14
