name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  init-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Crear borrador de Release en GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes_file="docs/releases/RELEASE_NOTES_${tag#v}.md"
          if [ -f "$notes_file" ]; then
            gh release create "$tag" \
              --title "Pulse Core $tag" \
              --notes-file "$notes_file" \
              --verify-tag
          else
            gh release create "$tag" \
              --title "Pulse Core $tag" \
              --generate-notes \
              --verify-tag
          fi

  windows:
    name: Build & publish Windows bundle
    runs-on: windows-latest
    needs: init-release
    steps:
      - uses: actions/checkout@v4

      - name: Instalar cadena de herramientas Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Caché de Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-release

      # Firma Authenticode opcional — requiere los secretos:
      #   WINDOWS_CERT_BASE64    (certificado .pfx codificado en base64)
      #   WINDOWS_CERT_PASSWORD  (contraseña del archivo .pfx)
      - name: Importar certificado de firma (opcional)
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CERT_PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ($env:CERT_B64) {
            $bytes = [Convert]::FromBase64String($env:CERT_B64)
            $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
            [IO.File]::WriteAllBytes($pfx, $bytes)
            $cert = Import-PfxCertificate -FilePath $pfx `
              -CertStoreLocation Cert:\CurrentUser\My `
              -Password (ConvertTo-SecureString $env:CERT_PASS -AsPlainText -Force)
            "THUMB=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "Certificado importado: $($cert.Thumbprint)"
          } else {
            Write-Host "Sin certificado de firma configurado — compilación sin firma"
          }

      - name: Compilar paquete servidor estándar (release)
        shell: pwsh
        run: |
          $buildArgs = @()
          if ($env:THUMB) {
            $buildArgs = @('-CertificateThumbprint', $env:THUMB)
          }
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File scripts\build_windows_server.ps1 @buildArgs

      - name: Verificar paquete generado (sin exposición lab.*)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File scripts\test_packaged_bundle.ps1

      - name: Subir artefacto Windows a Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zip = Get-ChildItem dist\PulseCore-Server-Windows-x64.zip | Select-Object -First 1
          if (!$zip) { throw "No se encontró el archivo ZIP de distribución en dist/" }
          $assets = @($zip.FullName, "$($zip.FullName).sha256")
          $sbom = Get-ChildItem dist\PulseCore-Server-Windows\sbom\*.json -ErrorAction SilentlyContinue
          foreach ($s in $sbom) { $assets += $s.FullName }
          gh release upload $tag $assets --clobber

  linux:
    name: Build & publish Linux bundle
    runs-on: ubuntu-latest
    needs: init-release
    steps:
      - uses: actions/checkout@v4

      - name: Instalar cadena de herramientas Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Caché de Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-x64-release

      - name: Compilar daemon, CLI y asistente en Rust (release)
        run: cargo build --release -p mule-daemon -p mule-cli -p mule-assistant

      - name: Empaquetar distribución Linux
        run: |
          tag="${GITHUB_REF_NAME}"
          bundle="PulseCore-${tag}-linux-x64"
          mkdir -p "dist/$bundle"
          cp target/release/mule-daemon target/release/mule-cli target/release/mule-assistant scripts/mule-daemon.service "dist/$bundle/"
          tar -czvf "dist/$bundle.tar.gz" -C dist "$bundle"
          (cd dist && sha256sum "$bundle.tar.gz" > "$bundle.tar.gz.sha256")

      - name: Subir artefacto Linux a la Release de GitHub
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release upload "$tag" \
            "dist/PulseCore-${tag}-linux-x64.tar.gz" \
            "dist/PulseCore-${tag}-linux-x64.tar.gz.sha256" \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux-arm64:
    name: Build & publish Raspberry Pi (ARM64) bundle
    runs-on: ubuntu-latest
    needs: init-release
    steps:
      - uses: actions/checkout@v4

      - name: Instalar compilador cruzado aarch64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Instalar cadena de herramientas Rust (aarch64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Caché de Cargo (aarch64)
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-arm64-release

      - name: Compilar daemon, CLI y asistente en Rust (aarch64 release)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: cargo build --release --target aarch64-unknown-linux-gnu -p mule-daemon -p mule-cli -p mule-assistant

      - name: Empaquetar distribución Raspberry Pi (ARM64)
        run: |
          tag="${GITHUB_REF_NAME}"
          bundle="PulseCore-${tag}-linux-arm64"
          mkdir -p "dist/$bundle"
          cp target/aarch64-unknown-linux-gnu/release/mule-daemon target/aarch64-unknown-linux-gnu/release/mule-cli target/aarch64-unknown-linux-gnu/release/mule-assistant scripts/mule-daemon.service "dist/$bundle/"
          tar -czvf "dist/$bundle.tar.gz" -C dist "$bundle"
          (cd dist && sha256sum "$bundle.tar.gz" > "$bundle.tar.gz.sha256")

      - name: Subir artefacto Raspberry Pi (ARM64) a la Release de GitHub
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release upload "$tag" \
            "dist/PulseCore-${tag}-linux-arm64.tar.gz" \
            "dist/PulseCore-${tag}-linux-arm64.tar.gz.sha256" \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
