[package]
name = "mule-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Deterministic eD2K wire protocol codec, framing and abstractions for eMuleRust"

[features]
default = []
lab-loopback = []
ed2k-loopback = ["dep:tokio", "dep:serde_json"]
ed2k-reference-loopback = ["ed2k-loopback"]

[dependencies]
bytes.workspace = true
thiserror.workspace = true
hex.workspace = true
tokio = { workspace = true, optional = true, features = ["net", "io-util", "time", "sync", "rt"] }
unicode-normalization.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
md4.workspace = true
md-5.workspace = true
num-bigint.workspace = true
rand.workspace = true
flate2.workspace = true
zstd.workspace = true


[dev-dependencies]
mule-core = { path = "../mule-core" }
mule-format = { path = "../mule-format" }
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }
md4.workspace = true
proptest.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[[test]]
name = "protocol_lab_suite"
path = "tests/protocol_lab_suite/main.rs"
required-features = ["lab-loopback"]

[[test]]
name = "protocol_ed2k_suite"
path = "tests/protocol_ed2k_suite/main.rs"
required-features = ["ed2k-loopback"]

[[test]]
name = "tier3_loopback"
required-features = ["ed2k-reference-loopback"]


