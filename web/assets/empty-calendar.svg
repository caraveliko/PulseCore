<!-- Ilustración vectorial de estado vacío para el calendario de estrenos -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 140" width="180" height="140" fill="none">
  <defs>
    <radialGradient id="ecGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="65%" stop-color="#8b5cf6" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#050810" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ecGrad" x1="42" y1="26" x2="138" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
  </defs>

  <ellipse cx="90" cy="70" rx="72" ry="52" fill="url(#ecGlow)" />

  <!-- Marco del calendario -->
  <rect x="46" y="34" width="88" height="74" rx="12" fill="#09101d" fill-opacity="0.92" stroke="url(#ecGrad)" stroke-width="1.5" />
  <line x1="46" y1="54" x2="134" y2="54" stroke="rgba(255,255,255,0.12)" stroke-width="1.2" />

  <!-- Anillas superiores -->
  <line x1="68" y1="26" x2="68" y2="40" stroke="#00f5d4" stroke-width="2.4" stroke-linecap="round" />
  <line x1="112" y1="26" x2="112" y2="40" stroke="#38bdf8" stroke-width="2.4" stroke-linecap="round" />

  <!-- Celdas de días -->
  <g fill="rgba(255,255,255,0.14)">
    <rect x="58" y="64" width="12" height="10" rx="2.5" />
    <rect x="76" y="64" width="12" height="10" rx="2.5" />
    <rect x="94" y="64" width="12" height="10" rx="2.5" />
    <rect x="112" y="64" width="12" height="10" rx="2.5" />
    <rect x="58" y="81" width="12" height="10" rx="2.5" />
    <rect x="76" y="81" width="12" height="10" rx="2.5" />
    <rect x="112" y="81" width="12" height="10" rx="2.5" />
  </g>
  <!-- Día destacado con destello -->
  <rect x="94" y="81" width="12" height="10" rx="2.5" fill="#00f5d4" fill-opacity="0.78" />
</svg>
