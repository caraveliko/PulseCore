<!-- Icono de pestaña e icono base para PWA de Pulse Core (sin filtros complejos para rasterizado limpio) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="favBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1222" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>
    <linearGradient id="favGrad" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="50%" stop-color="#00bbf9" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <radialGradient id="favHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.28" />
      <stop offset="70%" stop-color="#00bbf9" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#060911" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Fondo redondeado obsidiana -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#favBg)" stroke="#1e293b" stroke-width="2" />
  <circle cx="32" cy="32" r="24" fill="url(#favHalo)" />

  <!-- Anillo hexagonal de nodos -->
  <circle cx="32" cy="32" r="20" stroke="url(#favGrad)" stroke-width="1.3" stroke-opacity="0.45" stroke-dasharray="3.5 3.5" />
  <g stroke="url(#favGrad)" stroke-width="1.3" stroke-opacity="0.65" stroke-linecap="round">
    <line x1="32" y1="12" x2="32" y2="19.5" />
    <line x1="49.3" y1="22" x2="42.8" y2="25.7" />
    <line x1="49.3" y1="42" x2="42.8" y2="38.3" />
    <line x1="32" y1="52" x2="32" y2="44.5" />
    <line x1="14.7" y1="42" x2="21.2" y2="38.3" />
    <line x1="14.7" y1="22" x2="21.2" y2="25.7" />
  </g>

  <circle cx="32" cy="12" r="2.5" fill="#00f5d4" />
  <circle cx="49.3" cy="22" r="2.3" fill="#00bbf9" />
  <circle cx="49.3" cy="42" r="2.3" fill="#7c3aed" />
  <circle cx="32" cy="52" r="2.5" fill="#00bbf9" />
  <circle cx="14.7" cy="42" r="2.3" fill="#7c3aed" />
  <circle cx="14.7" cy="22" r="2.3" fill="#00f5d4" />

  <!-- Núcleo y onda de pulso -->
  <circle cx="32" cy="32" r="13" fill="#060911" stroke="url(#favGrad)" stroke-width="2.6" />
  <path d="M 22 32 H 26.8 L 29.1 25.6 L 31.8 38.4 L 34.4 28.2 L 36.6 33.8 L 38 32 H 42"
        stroke="#00f5d4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
</svg>
