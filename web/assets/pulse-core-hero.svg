<!-- Emblema principal de alto detalle para pantalla de acceso y avisos -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="50%" stop-color="#00bbf9" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="lineGradCyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#00bbf9" stop-opacity="0.32" />
    </linearGradient>
    <linearGradient id="lineGradBluePurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00bbf9" stop-opacity="0.52" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.24" />
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.88" />
      <stop offset="42%" stop-color="#00bbf9" stop-opacity="0.52" />
      <stop offset="78%" stop-color="#7c3aed" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#060911" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nodeGlowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#00bbf9" />
    </radialGradient>
    <radialGradient id="nodeGlowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#00bbf9" />
      <stop offset="100%" stop-color="#4361ee" />
    </radialGradient>
    <radialGradient id="nodeGlowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ec4899" />
    </radialGradient>
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="coreGlowFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Anillos orbitales de sincronización -->
  <g class="pulse-rings" opacity="0.28">
    <circle cx="250" cy="250" r="72" fill="none" stroke="#00f5d4" stroke-width="1.3" stroke-dasharray="4 8" />
    <circle cx="250" cy="250" r="140" fill="none" stroke="#00bbf9" stroke-width="1.0" stroke-dasharray="6 12" />
    <circle cx="250" cy="250" r="212" fill="none" stroke="#7c3aed" stroke-width="0.9" stroke-dasharray="3 15" />
    <circle cx="250" cy="250" r="240" fill="none" stroke="#00f5d4" stroke-width="0.6" stroke-opacity="0.4" />
  </g>

  <circle cx="250" cy="250" r="64" fill="url(#coreGlow)" />

