<!-- Ilustración vectorial de estado vacío para la lista de descargas -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 140" width="180" height="140" fill="none">
  <defs>
    <radialGradient id="edGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.24" />
      <stop offset="65%" stop-color="#0ea5e9" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#050810" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="edGrad" x1="40" y1="20" x2="140" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <ellipse cx="90" cy="70" rx="74" ry="54" fill="url(#edGlow)" />

  <!-- Anillos de radar P2P -->
  <circle cx="90" cy="70" r="52" stroke="url(#edGrad)" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="4 5" />
  <circle cx="90" cy="70" r="35" stroke="url(#edGrad)" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="6 4" />

  <!-- Enlaces entre nodos en reposo -->
  <g stroke="url(#edGrad)" stroke-opacity="0.45" stroke-width="1.3" stroke-linecap="round">
    <line x1="90" y1="70" x2="45" y2="44" />
    <line x1="90" y1="70" x2="136" y2="45" />
    <line x1="90" y1="70" x2="132" y2="99" />
    <line x1="90" y1="70" x2="48" y2="96" />
  </g>

  <circle cx="45" cy="44" r="4" fill="#0b1322" stroke="#00f5d4" stroke-width="1.6" />
  <circle cx="136" cy="45" r="4" fill="#0b1322" stroke="#38bdf8" stroke-width="1.6" />
  <circle cx="132" cy="99" r="3.5" fill="#0b1322" stroke="#8b5cf6" stroke-width="1.6" />
  <circle cx="48" cy="96" r="3.5" fill="#0b1322" stroke="#38bdf8" stroke-width="1.6" />

  <!-- Núcleo central de transferencia -->
  <rect x="69" y="49" width="42" height="42" rx="12" fill="#09101d" fill-opacity="0.92" stroke="url(#edGrad)" stroke-width="1.6" />
  <path d="M 90 61 V 77 M 83.5 71 L 90 77.5 L 96.5 71" stroke="#00f5d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="81" y1="82" x2="99" y2="82" stroke="#38bdf8" stroke-opacity="0.7" stroke-width="1.8" stroke-linecap="round" />
</svg>
